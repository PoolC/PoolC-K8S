controller:
  config:
    log-format-upstream: '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_length $request_time [$proxy_upstream_name] [$proxy_alternative_upstream_name] $upstream_addr $upstream_response_length $upstream_response_time $upstream_status $req_id namespace:$namespace service:$service_name'
  metrics:
    enabled: true
    port: 10254
    service:
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: ingress-nginx
      nodePort: 30113
      ports:
        - name: metrics
          port: 10254
          targetPort: 10254
      type: NodePort
    serviceMonitor:
      additionalLabels:
        release: kube-prometheus-stack
      enabled: true
  podAnnotations:
    prometheus.io/port: "10254"
    prometheus.io/scrape: "true"
  service:
    nodePorts:
      http: 30080
      https: 30443
    type: NodePort
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/ingress
      operator: Equal
      value: "true"
