---
apiVersion: v1
kind: Service
metadata:
  name: loki-headless
  namespace: monitoring
spec:
  clusterIP: None
  ports:
    - name: http
      port: 3100
      protocol: TCP
      targetPort: 3100
    - name: gossip
      port: 7946
      protocol: TCP
      targetPort: 7946
  selector:
    app: loki
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
spec:
  ports:
    - name: http
      port: 3100
      protocol: TCP
      targetPort: 3100
  selector:
    app: loki
  type: ClusterIP
