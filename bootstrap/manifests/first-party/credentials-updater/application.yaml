---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: credentials-updater
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: pks-bootstrapping
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: poolc-system-proj
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/PKS/credentials-updater.git
    targetRevision: HEAD
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: poolc-system
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  info:
    - name: "PKS Credentials Updater Repository:"
      value: http://git.poolc.org/PKS/credentials-updater
