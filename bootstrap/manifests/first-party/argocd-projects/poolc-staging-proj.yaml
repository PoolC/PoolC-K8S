---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: poolc-staging-proj
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: pks-bootstrapping
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Staging environment for the PoolC web application
  sourceRepos:
    - https://github.com/PoolC/PoolC-K8S.git
  destinations:
    - name: in-cluster
      namespace: poolc-staging
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceBlacklist: []
  orphanedResources:
    warn: false
