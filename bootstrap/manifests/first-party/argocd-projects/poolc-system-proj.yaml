---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: poolc-system-proj
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: pks-bootstrapping
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: A project for PKS-specific system-wide applications
  sourceRepos:
    - http://gitea-http.gitea.svc.cluster.local:3000/PKS/credentials-updater.git
    - https://github.com/PoolC/*
  destinations:
    - name: in-cluster
      namespace: poolc-system
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceBlacklist: []
  orphanedResources:
    warn: false
