---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: admin-proj
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: pks-bootstrapping
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: A project for system-wide applications
  sourceRepos:
    - http://gitea-http.gitea.svc.cluster.local:3000/PKS/bootstrapping.git
    - https://github.com/PoolC/pks-bootstrapping.git
    - https://github.com/rancher/local-path-provisioner.git
    - https://bitnami-labs.github.io/sealed-secrets
    - https://dl.gitea.com/charts/
    - https://kubernetes.github.io/ingress-nginx
    - https://kyverno.github.io/kyverno/
    - https://prometheus-community.github.io/helm-charts
    - https://argoproj.github.io/argo-helm
    - https://helm.cilium.io/
    - https://grafana.github.io/helm-charts
    - https://fluent.github.io/helm-charts
    - https://charts.jetstack.io
  destinations:
    - name: in-cluster
      namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceBlacklist: []
  orphanedResources:
    warn: false
