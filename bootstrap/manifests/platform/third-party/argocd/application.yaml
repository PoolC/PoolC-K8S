---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: pks-bootstrapping
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: admin-proj
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      targetRevision: 8.5.0
      chart: argo-cd
      helm:
        releaseName: argocd
        valueFiles:
          - $values/third-party/argocd/values.yaml
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/PKS/bootstrapping.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
