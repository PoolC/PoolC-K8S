---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: pks-bootstrapping
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: admin-proj
  sources:
    - repoURL: https://helm.cilium.io/
      targetRevision: 1.17.4
      chart: cilium
      helm:
        releaseName: cilium
        valueFiles:
          - $values/platform/third-party/cilium/values.yaml
    - repoURL: https://github.com/PoolC/PoolC-K8S.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  ignoreDifferences:
    - group: ""
      kind: Secret
      namespace: kube-system
      name: cilium-ca
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      namespace: kube-system
      name: hubble-server-certs
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
